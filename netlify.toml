[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Página única (SPA): toda rota que não é arquivo nem função abre o app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
